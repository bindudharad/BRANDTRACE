services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brandtrace
      POSTGRES_USER: brandtrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Docker Compose}
    volumes:
      - brandtrace-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandtrace -d brandtrace"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://brandtrace:${POSTGRES_PASSWORD}@database:5432/brandtrace
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
volumes:
  brandtrace-postgres:
